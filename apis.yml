name: Publer
kind: company
description: 'Publer is a social-media scheduling and management platform for planning, creating, publishing
  and analyzing content across Facebook, Instagram, X/Twitter, LinkedIn, TikTok, YouTube, Pinterest, Threads,
  Bluesky, Mastodon, Google Business Profiles, WordPress and Telegram. The Publer API (v1) is a RESTful
  JSON interface at https://app.publer.com/api/v1 covering 21 operations: schedule and publish posts,
  update and delete them, manage connected social accounts and workspaces, upload and list media, resolve
  asynchronous jobs, and read analytics including post insights, hashtag performance, best times to post
  and competitor comparison. Authentication is an API key sent as Authorization: Bearer-API with a Publer-Workspace-Id
  header, scoped per key. Publer also ships a first-party hosted MCP server in beta. API access is limited
  to Enterprise plan users, Business plan users in good standing, and Top Ambassadors.'
