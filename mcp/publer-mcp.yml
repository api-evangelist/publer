method: searched
source: >-
  https://publer.com/help/en/article/how-to-set-up-and-use-publers-mcp-server-14orlq0/
  (Publer Help Center, "How to set up and use Publer's MCP server", updated
  12/08/2026) and
  https://publer.com/help/en/category/automations-1a56089/
provider: Publer
providerId: publer
name: Publer MCP Server
status: published
maturity: beta
description: >-
  Publer ships a FIRST-PARTY, HOSTED (remote) MCP server that connects an
  MCP-compatible client — Publer names Claude, ChatGPT and Cursor — to a Publer
  workspace. It is configured from the Publer app under Settings -> AI &
  Automations -> AI & MCP -> MCP. The user first creates a Publer API key and
  selects its scopes (Workspaces and Accounts are mandatory; Posts, Media and
  Analytics are optional), and Publer then GENERATES A PER-ACCOUNT MCP SERVER
  URL that the user pastes into the AI client's connector settings, together
  with an authorization header carrying the same API key.

deployment:
  mode: remote
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: searched
  note: >-
    Deliberately null endpoint. Publer does NOT publish a static MCP URL: the
    help article states the server URL is generated for the account after an API
    key is supplied, and instructs users not to share the MCP server URL
    publicly. No endpoint was guessed or probed — a fabricated URL would falsely
    read as a verified agent surface. `mode: remote` is asserted because the
    documented artifact is a server URL pasted into a client's connector
    settings, not an npx/stdio package; there is no local-stdio distribution.

availability:
  general_availability: false
  gated: true
  entitlement: >-
    BETA. Publer states MCP is "available in BETA with our top ambassadors and
    Enterprise customers", and that MCP access depends on plan and account
    setup. The underlying Public API itself is limited to Enterprise plan users,
    Business plan users in good standing, and Top Ambassadors.

authentication:
  scheme: api-key
  transport: authorization header
  detail: >-
    The same Publer API key used for the REST API ("Authorization: Bearer-API
    YOUR_API_KEY"). Permissions available through MCP are exactly the scopes
    selected when the API key was created — see scopes/publer-scopes.yml.
  oauth: false

