description: >-
  Publer is sold as a SaaS subscription in four tiers — Free, Professional,
  Business and Enterprise. Pricing scales per connected social account and per
  team member rather than per API call; every 10th social account and every 10th
  team member is free, and paying yearly saves up to 20%. Paid tiers include
  unlimited workspaces at no extra cost.
api_entitlement:
  required_plan:
  - Enterprise
  - Business (accounts in good standing only — no failed or locked subscriptions)
  - Top Ambassadors
  excluded:
  - Free
  - Professional
  note: >-
    The Public API is NOT sold as a separate product or metered add-on. It is an
    entitlement of the subscription tier plus account standing, which means an
    account can lose API access without changing plan. The MCP server is a
    further-gated beta, limited to Top Ambassadors on the Enterprise plan.
  source: https://publer.com/help/en/article/does-publer-have-a-public-api-194nknf/
notes: >-
  PRICE FIGURES ARE APPROXIMATE AND WERE NOT RE-VERIFIABLE ON 2026-08-13.
  https://publer.com/pricing returns HTTP 200 but is a Framer page that renders
  every price client-side — the 815 KB HTML payload contains no price strings at
  all, and no machine-readable pricing or catalog endpoint is published. The
  figures below were observed on 2026-06-25 and are retained as approximations,
  flagged with price_verified: false. Plan STRUCTURE (tiers, per-account and
  per-member scaling, the every-10th-free rule, the 20% annual discount, the
  14-day trial and the API entitlement) is verified from the help center
  articles cited above.
