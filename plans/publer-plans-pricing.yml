billing:
  currency: USD
  periods:
  - monthly
  - annual
  annual_discount: up to 20%
  trial: 14-day free trial on Business and Enterprise; credit card or PayPal required
  volume_rule: Every 10th social account and every 10th team member is free.
  workspaces: Unlimited on all paid plans, at no extra cost.
plans:
- id: publer-free
  name: Free
  type: free
  api_access: false
  price_verified: true
  description: >-
    Free-forever plan to connect and schedule posts for a small number of social
    accounts. Twitter/X accounts cannot be connected on Free. Does not include
    API access.
  entries:
  - label: Free Plan
    name: free
    type: flat
    metric: subscription
    limit: 3
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  elements:
  - name: 1 workspace
  - name: 3 social accounts (excluding Twitter/X)
  - name: 10 pending scheduled posts per account
  - name: 25 saved drafts
  - name: 24 hours of published-post history
  - name: Link in Bio for Instagram
  - name: Free trials on paid features
- id: publer-professional
  name: Professional
  type: paid
  api_access: false
  price_verified: false
  description: >-
    Subscription tier for individuals and small teams — unlimited scheduled
    posts and drafts, Twitter/X support, eternal post history, bulk scheduling
    up to 500 posts, media library and analytics. Does NOT include API access.
  entries:
  - label: Professional Plan (base)
    name: professional
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: approx. $12/mo for 3 accounts (unverified 2026-08-13; annual ~20% cheaper)
    userMultiplied: false
  - label: Additional social account
    name: professional_extra_account
    type: usage
    metric: accounts
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: approx. $4 per additional account / month (unverified 2026-08-13)
    userMultiplied: true
  elements:
  - name: Unlimited scheduled posts and drafts
  - name: Twitter/X accounts
  - name: Bulk scheduling up to 500 posts
  - name: Media Library
  - name: Analytics
- id: publer-business
  name: Business
  type: paid
  api_access: conditional
  price_verified: false
  description: >-
    Full-feature tier for teams and agencies. Includes everything in
    Professional plus team collaboration and advanced analytics. THE PUBLIC API
    IS AVAILABLE ON THIS TIER ONLY WHILE THE ACCOUNT IS IN GOOD STANDING — an
    account with a failed or locked subscription loses API access.
  entries:
  - label: Business Plan (base)
