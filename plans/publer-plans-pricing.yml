    userMultiplied: true
  - label: Additional team member
    name: business_extra_member
    type: usage
    metric: members
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: approx. $3 per additional member / month (unverified 2026-08-13)
    userMultiplied: true
  elements:
