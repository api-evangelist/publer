                        description: Days of the week (0=Monday, 6=Sunday)
                        items:
                          type: integer
                          minimum: 0
                          maximum: 6
                      repeat_rate:
                        type: integer
                        description: Rate of repetition
                  share_next:
                    type: boolean
                    description: Whether to share the post next in queue
