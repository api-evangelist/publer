    JobStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        data:
          type: object
          properties:
            status:
              type: string
              enum:
              - working
              - complete
              - failed
              description: "Current status of the job \n\n - `working`: The job is still processing.\n\
                \ - `complete`: The job has completed successfully.\n - `failed`: The job has failed."
            result:
              type: object
              description: Result data, contents depend on job type
              properties:
                status:
                  type: string
                  enum:
                  - working
                  - complete
                  - failed
                  description: "Current status of the job \n\n - `working`: The job is still processing.\n\
                    \ - `complete`: The job has completed successfully.\n - `failed`: The job has failed."
                payload:
                  type: object
                  description: Result payload containing any operation results
                  properties:
                    failures:
                      type: object
                      description: Any failures that occurred during processing
                plan:
                  type: object
                  description: Current user's plan information
                  properties:
                    rate:
                      type: string
                      description: The rate plan of the workspace
                    locked:
                      type: boolean
                      description: Whether the workspace is locked
    MediaUploadResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the uploaded media
        path:
          type: string
          description: URL path to access the uploaded media
        thumbnail:
          type: string
          description: URL path to access a thumbnail version of the media
        validity:
          type: object
          description: Indicates which networks and post types support this media
        width:
          type: number
          description: Width of the media in pixels
        height:
          type: number
          description: Height of the media in pixels
        source:
          type: string
          description: Source attribution for the media
        type:
          type: string
          description: Media type (photo, video, document)
        name:
          type: string
          description: Original filename
        caption:
          type: string
          description: Caption for the media
    403JobErrorResponse:
      type: object
      properties:
        errors:
          type: array
          description: List of error messages
          items:
            type: string
    MediaFromUrlRequest:
      type: object
      required:
      - media
      - type
      properties:
        media:
          type: array
          description: List of media URLs and metadata
          items:
            type: object
            required:
            - url
            - name
            properties:
              url:
                type: string
                description: URL of the media to download
              name:
                type: string
                description: Custom name for the media file
              caption:
                type: string
                description: Caption for the media
              source:
                type: string
                description: Source attribution for the media
        type:
          type: string
          description: Upload type
          enum:
          - single
          - thumbnail
          - bulk
          - thumbnail
        direct_upload:
          type: boolean
          description: Whether to upload directly to our S3 cloud (slower, but required if you need the
            final media URL)
          default: false
        in_library:
          type: boolean
          description: Whether to save to media library
          default: false
    PostDetail:
