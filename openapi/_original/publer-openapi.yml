                              type: object
                              description: When to share the post after the original is published
                              properties:
                                duration:
                                  type: number
                                  description: The duration value
                                unit:
                                  type: string
                                  description: The time unit (Minute, Hour, Day, Week)
                                  enum:
                                  - Minute
                                  - Hour
                                  - Day
                                  - Week
