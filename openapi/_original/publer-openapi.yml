    WordPressNetworkContent:
      type: object
      required:
      - type
      - content
      properties:
        type:
          type: string
          description: Content type for WordPress
          enum:
          - article
        text:
          type: string
          description: Post text content
        excerpt:
          type: string
          description: Short excerpt of the article
        title:
          type: string
          description: Article title
        url:
          type: string
          description: Article URL slug
        post_link:
          type:
          - string
