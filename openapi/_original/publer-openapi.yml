            type: string
    403ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          description: List of error messages
          items:
            type: string
    Account:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the account
        provider:
          type: string
          description: The social network provider
          enum:
          - bluesky
          - facebook
          - instagram
          - linkedin
          - twitter
          - tiktok
          - youtube
          - pinterest
          - google
          - wordpress
          - telegram
          - mastodon
          - threads
        name:
          type: string
          description: The display name of the social media account
        social_id:
          type: string
          description: Unique identifier for the account on the social media platform
        picture:
          type: string
          description: URL to the account's avatar/logo
        type:
          type: string
          description: Account type
          enum:
          - page
          - profile
          - group
          - business
          - channel
          - location
          - blog
    401ErrorResponseWithWorkspace:
      type: object
      properties:
        errors:
          type: array
          description: List of error messages
          items:
            type: string
    PostsListResponse:
      type: object
      properties:
        posts:
          type: array
          description: List of posts matching the query parameters
          items:
            $ref: '#/components/schemas/PostSummary'
