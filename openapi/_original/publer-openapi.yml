  /media:
    get:
      summary: List Media
      description: Retrieves a paginated list of media items from the user's library. The endpoint supports
        filtering by various parameters and can also retrieve specific media items by their IDs.
      tags:
      - Media
      parameters:
      - schema:
          type: string
        name: Publer-Workspace-Id
        in: header
        description: ID of the workspace to retrieve media from
        required: true
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        name: ids
        in: query
        description: Specific media IDs to retrieve. If provided, pagination and other filters are ignored
        required: false
      - schema:
          type: integer
        name: page
        in: query
        description: Page number for pagination (0-based)
        required: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - photo
            - video
            - gif
        style: form
        explode: false
        name: types
        in: query
        description: Filter by media types
        required: true
      - schema:
          type: array
          items:
            type: boolean
        style: form
        explode: false
        name: used
        in: query
        description: Filter by used status
        required: true
      - schema:
          type: array
          items:
            type: string
            enum:
            - canva
            - vista
            - postnitro
            - contentdrips
            - openai
            - favorites
        style: form
        explode: false
        name: source
        in: query
        description: Filter by source
        required: false
      - schema:
          type: string
        name: search
        in: query
        description: Search term to filter media by name or caption
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the media
                        type:
                          type: string
                          description: Type of media
                          enum:
                          - photo
                          - video
                          - gif
                        name:
                          type: string
                          description: Name of the media
                        caption:
                          type: string
                          description: Caption for the media
                        path:
                          type: string
                          description: URL to the full media
                        thumbnails:
                          type: array
                          description: Array of thumbnails objects associated with the media
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier for the thumbnail
                              small:
                                type: string
                                description: URL to the small thumbnail
                              real:
                                type: string
                                description: URL to the real thumbnail
                        created_at:
                          type: string
                          format: date-time
                          description: Creation timestamp
                        updated_at:
                          type: string
                          format: date-time
                          description: Last update timestamp
                        favorite:
                          type: boolean
                          description: Whether the media is marked as favorite
                        in_library:
                          type: boolean
                          description: Whether the media is saved in the library
                  total:
                    type: integer
                    description: Total count of media items matching the query (without pagination)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401ErrorResponse'
        '403':
          description: Permission denied or missing required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403ErrorResponse'
    post:
      summary: Upload a media file directly
      description: Upload a media file (image, video, or document) to be used in social media posts
      tags:
      - Media
      parameters:
      - schema:
          type: string
        name: Publer-Workspace-Id
        in: header
        description: ID of the workspace to upload media
        required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                direct_upload:
                  type: boolean
                  description: Whether to upload directly to our S3 cloud (slower, but required if you
                    need the final media URL)
                  default: false
                in_library:
                  type: boolean
                  description: Whether to save to media library
                  default: false
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: Media file uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401ErrorResponse'
        '413':
          description: Permission denied or missing required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403ErrorResponse'
  /posts:
    get:
      summary: List Posts
      description: Retrieves a list of posts based on the specified filters.
      tags:
      - Posts
      parameters:
      - schema:
          type: string
        name: Publer-Workspace-Id
        in: header
        description: ID of the workspace to retrieve posts from
        required: true
      - schema:
          type: string
          enum:
          - all
          - scheduled
          - scheduled_approved
          - scheduled_pending
          - scheduled_declined
          - scheduled_reauth
          - scheduled_locked
          - published
          - published_posted
          - published_deleted
          - published_hidden
          - draft
          - draft_dated
          - draft_undated
          - draft_private
          - draft_public
          - failed
          - recycling
          - recycling_active
          - recycling_paused
          - recycling_expired
          - recycling_failed
          - recycling_pending
          - recycling_declined
          - recycling_reauth
          - recycling_locked
          - recurring
        name: state
        in: query
        description: "Filter by post state\n\n Available options: \n\n `all`, `scheduled`, `scheduled_approved`,\
          \ `scheduled_pending`, `scheduled_declined`, `scheduled_reauth`, `scheduled_locked`, `published`,\
          \ `published_posted`, `published_deleted`, `published_hidden`, `draft`, `draft_dated`, `draft_undated`,\
          \ `draft_private`, `draft_public`, `failed`, `recycling`, `recycling_active`, `recycling_paused`,\
          \ `recycling_expired`, `recycling_failed`, `recycling_pending`, `recycling_declined`, `recycling_reauth`,\
          \ `recycling_locked`, `recurring`"
        required: false
      - schema:
          type: array
          items:
            type: string
            enum:
            - all
            - scheduled
            - scheduled_approved
            - scheduled_pending
            - scheduled_declined
            - scheduled_reauth
            - scheduled_locked
            - published
            - published_posted
            - published_deleted
            - published_hidden
            - draft
            - draft_dated
            - draft_undated
            - draft_private
            - draft_public
            - failed
            - recycling
            - recycling_active
            - recycling_paused
            - recycling_expired
            - recycling_failed
            - recycling_pending
            - recycling_declined
            - recycling_reauth
            - recycling_locked
            - recurring
        style: form
        explode: true
        name: state
        in: query
        description: "Filter by multiple post states\n\n Available options: \n\n `all`, `scheduled`, `scheduled_approved`,\
          \ `scheduled_pending`, `scheduled_declined`, `scheduled_reauth`, `scheduled_locked`, `published`,\
          \ `published_posted`, `published_deleted`, `published_hidden`, `draft`, `draft_dated`, `draft_undated`,\
          \ `draft_private`, `draft_public`, `failed`, `recycling`, `recycling_active`, `recycling_paused`,\
          \ `recycling_expired`, `recycling_failed`, `recycling_pending`, `recycling_declined`, `recycling_reauth`,\
          \ `recycling_locked`, `recurring`"
        required: false
      - schema:
          type: string
          format: date
        name: from
        in: query
        description: "Filter posts scheduled/published after this date \n\n- Example: 2025-05-15 \n\n\
          \ Required if `to` is provided"
        required: false
      - schema:
          type: string
          format: date
        name: to
        in: query
        description: "Filter posts scheduled/published before this date \n\n- Example: 2025-05-15 \n\n\
          \ Required if `from` is provided"
        required: false
      - schema:
          type: integer
        name: page
        in: query
        description: Page number for pagination
        required: false
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        name: account_ids
        in: query
        description: Filter posts by multiple account IDs
        required: false
      - schema:
          type: string
        name: query
        in: query
        description: Search query to filter posts by content
        required: false
      - schema:
          type: string
          enum:
          - status
          - link
          - photo
          - gif
          - video
          - reel
          - story
          - short
          - poll
          - document
          - carousel
          - article
        name: postType
        in: query
        description: "Filter by post type \n\n Available options: \n\n `status`, `link`, `photo`, `gif`,\
          \ `video`, `reel`, `story`, `short`, `poll`, `document`, `carousel`, `article`"
        required: false
      - schema:
          type: string
        name: member_id
        in: query
        description: Filter posts by team member ID
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401ErrorResponseWithWorkspace'
        '403':
          description: Permission denied or missing required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403ErrorResponse'
    delete:
      summary: Delete Multiple Posts
      description: Deletes one or multiple posts from the workspace specifying exact post IDs. Authorization
        rules apply to ensure users can only delete posts they have permission to delete.
      tags:
      - Posts
      parameters:
      - schema:
          type: string
        name: Publer-Workspace-Id
        in: header
        description: ID of the workspace containing the posts
        required: true
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        name: post_ids
        in: query
        description: Array of post IDs to delete. Can include both MongoDB ObjectIDs and PostgreSQL IDs.
        required: true
      responses:
        '200':
          description: Posts deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_ids:
                    type: array
                    description: Array of IDs of successfully deleted posts
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401ErrorResponseWithWorkspace'
        '403':
          description: Permission denied or missing required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403ErrorResponse'
