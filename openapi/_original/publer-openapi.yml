          description: Link to published post
        source:
          type: string
          description: Source of the post
          enum:
          - schedule
          - publish
          - draft
        state:
          type: string
          description: Post state
          enum:
          - draft
          - scheduled
          - published
        content:
          type: array
          description: Structured content blocks
          items:
            type: object
            properties:
              id:
                type: string
                description: Block unique identifier
              type:
                type: string
                description: Block type
                enum:
                - paragraph
                - header
                - list
                - media
                - table
                - delimiter
                - code
                - html
                - quote
              data:
                type: object
                description: Block-specific data
                properties:
                  text:
                    type: string
                    description: Text content for paragraph, header, quote blocks
                  level:
                    type: integer
                    description: Header level (1-6)
                  style:
                    type: string
                    description: List style
                    enum:
                    - ordered
                    - unordered
                  items:
                    type: array
                    description: List items
                    items:
                      type: string
                  url:
                    type: string
                    description: Media URL
                  type:
                    type: string
                    description: Media type
                    enum:
                    - photo
                    - video
                  stretched:
                    type: boolean
                    description: Whether media is stretched
                  withHeadings:
                    type: boolean
                    description: Whether table has headings
                  content:
                    type: array
                    description: Table content
                    items:
                      type: string
                  code:
                    type: string
                    description: Code content
                  html:
                    type: string
                    description: HTML content
                  caption:
                    type: string
                    description: Quote caption/author
            required:
            - id
            - type
            - data
        categories:
          type: array
          items:
            type: string
          description: Article category IDs
        tags:
          type: array
          items:
            type: string
