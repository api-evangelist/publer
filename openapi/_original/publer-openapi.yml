                        type: string
                        description: Frequency of the gap
                        enum:
                        - Day
                        - Week
                        - Month
                      start_date:
                        type: string
                        description: Start date for recycling
                        format: date
                      expire_count:
                        type: string
                        description: Number of times to recycle
                      expire_date:
                        type: string
                        description: Date when recycling expires
                        format: date
                  recurring:
                    type: object
                    description: Recurring configuration for the post
                    required:
                    - start_date
                    - end_date
                    - repeat
                    - repeat_rate
                    properties:
                      start_date:
