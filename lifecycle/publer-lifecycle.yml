deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    Publer publishes NO deprecation policy. There is no documented Sunset or
    Deprecation response header (RFC 8594), no deprecation window, no
    end-of-life schedule, and no operation in the specification carries
    `deprecated: true`. The semver statement above governs breaking changes, not
    retirement, so no Deprecation pointer is emitted in apis.yml.

