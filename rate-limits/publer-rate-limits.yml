- name: Asynchronous jobs
  scope: workspace
  metric: jobs
  limit: not published
  notes: >-
    Schedule/publish/media-from-URL operations return 202 Accepted with a
    job_id and are processed asynchronously. No queue depth or concurrency
    limit is documented.

policies:
- name: Requesting higher limits
  description: >-
    Email support@publer.com with expected request volume (per minute/hour/day),
    use case and critical endpoints, and project/company contact info.
- name: Publisher best practices
  description: >-
    Publer recommends caching idempotent responses, using bulk endpoints
    (POST /posts/schedule for multiple posts), staggering non-urgent requests to
    off-peak hours, monitoring the X-RateLimit-* headers, and exponential
    backoff as the limit approaches.
- name: Async processing
  description: >-
    Scheduling and publishing are accepted (202) and processed asynchronously;
    poll GET /job_status/{job_id} for completion and inspect payload.failures[].
- name: Downstream network limits
  description: >-
    Each connected social network enforces its own publishing limits that apply
    on top of Publer's, and Publer's own daily post limits are aligned to those
    community guidelines.

