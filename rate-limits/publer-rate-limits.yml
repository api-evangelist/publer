description: >-
  Publer publishes concrete, numeric rate limits. The API limit is 100 requests
  per 2-minute fixed window, applied PER USER ACCOUNT across all of that user's
  API keys — creating additional keys does not buy additional throughput. Every
  response carries X-RateLimit-Limit, X-RateLimit-Remaining and
  X-RateLimit-Reset, and exhaustion returns 429 with a distinct error envelope.
  Separately, Publer enforces per-network DAILY POST LIMITS on a rolling
  24-hour UTC window that vary by plan; these are business limits enforced
  downstream and surface as per-account job failures, not as HTTP 429.
notes: >-
  Higher limits are available on request — Publer asks for expected request
  volume, use case, critical endpoints, and company/contact details, by email to
  support@publer.com. Downstream limits imposed by each connected social
  network also apply on top of Publer's own.
sources:
- https://publer.com/docs/getting-started/rate-limits.md
- https://publer.com/docs/overview.md
- https://publer.com/docs/api-reference/introduction.md

responseCodes:
  throttled: 429

headers:
- name: X-RateLimit-Limit
  description: Total requests allowed in the current window.
  example: '100'
- name: X-RateLimit-Remaining
  description: Requests remaining in the current time window.
  example: '0'
- name: X-RateLimit-Reset
  description: UNIX timestamp when the window resets (next available slot).
  example: '1714558492'
retry_after: false
retry_after_note: >-
  Publer does NOT send Retry-After on 429. Clients must compute the wait from
  X-RateLimit-Reset.

exhaustion:
  status: 429
  body: '{"error": "Rate limit exceeded. Retry later."}'
  envelope_note: >-
    Singular `error` string — every other error on this API uses an `errors`
    array. A client parsing `errors[]` gets undefined on a 429.
  headers_on_exhaustion:
  - 'X-RateLimit-Remaining: 0'
  - X-RateLimit-Reset set to a future timestamp

limits:
- name: API requests
  scope: user-account
  metric: requests
  limit: 100
  window: 2 minutes
  algorithm: fixed-window
  burst: null
  notes: >-
    Applied per user account ACROSS ALL API KEYS. Documented verbatim: "Limits
    are applied per user account (across all API keys) and use a fixed-window
    algorithm."

